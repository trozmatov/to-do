[build]
  command = "npm run build"
  publish = "dist"

# SPA: /widget, /settings kabi manzillar to'g'ridan-to'g'ri ochilganda index.html qaytariladi
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker va manifest har doim yangisi tekshirilsin (aks holda yangilanish kechikadi)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Hash nomli fayllar o'zgarmaydi -> uzoq keshlash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
